<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan 1</title>
</head>
<body>
    <h2>Penjumlahan Dua Angka</h2>

    <script>
        let angka1 = Number(prompt("Masukkan angka pertama:"));
        let angka2 = Number(prompt("Masukkan angka kedua:"));

        let hasil = angka1 + angka2;

        document.write("Angka pertama: " + angka1 + "<br>");
        document.write("Angka kedua: " + angka2 + "<br>");
        document.write("Hasil penjumlahan: " + hasil);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan 7</title>
</head>
<body>
    <h2>Tabel Perkalian 7</h2>

    <script>
        for (let i = 1; i <= 10; i++) {
            document.write("7 x " + i + " = " + (7 * i) + "<br>");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan 8</title>
</head>
<body>
    <h2>Cek Bilangan Genap</h2>

    <script>
        function cekGenap(angka) {
            return angka % 2 === 0;
        }

        let angka = Number(prompt("Masukkan sebuah angka:"));

        if (cekGenap(angka)) {
            document.write(angka + " adalah bilangan genap.");
        } else {
            document.write(angka + " adalah bilangan ganjil.");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan 9</title>
</head>
<body>
    <h2>Form Data Mahasiswa</h2>

    <form onsubmit="return validasi()">
        <label>Nama:</label><br>
        <input type="text" id="nama" required>
        <br><br>

        <label>NIM:</label><br>
        <input type="text" id="nim" required>
        <br><br>

        <button type="submit">Kirim</button>
    </form>

    <script>
        function validasi() {
            let nama = document.getElementById("nama").value.trim();
            let nim = document.getElementById("nim").value.trim();

            if (nama === "" || nim === "") {
                alert("Semua kolom wajib diisi!");
                return false;
            }

            alert("Data berhasil dikirim!");
            return false;
        }
    </script>
</body>
</html>
